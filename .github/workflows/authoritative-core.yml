name: Authoritative core checks

on:
  push:
    branches:
      - 'feature/authoritative-*'
  pull_request:
    paths:
      - 'Source/AuthoritativeCore/**'
      - 'Source/AuthoritativeCore.Tests/**'
      - 'Source/AuthoritativeRimWorldBridge/**'
      - '.github/workflows/authoritative-core.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build isolated authoritative core
        run: dotnet build Source/AuthoritativeCore/AuthoritativeCore.csproj -c Release --warnaserror
      - name: Build RimWorld-compatible netstandard2.0 target
        run: dotnet build Source/AuthoritativeCore/AuthoritativeCore.csproj -c Release --framework netstandard2.0 --warnaserror
      - name: Compile Verse integration bridge against RimWorld 1.6 references
        run: dotnet build Source/AuthoritativeRimWorldBridge/AuthoritativeRimWorldBridge.csproj -c Release
      - name: Execute focused authoritative tests
        run: dotnet run --project Source/AuthoritativeCore.Tests/AuthoritativeCore.Tests.csproj -c Release
