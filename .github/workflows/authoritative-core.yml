name: Authoritative core checks

on:
  push:
    branches:
      - 'feature/authoritative-*'
  pull_request:
    paths:
      - 'Source/AuthoritativeCore/**'
      - 'Source/AuthoritativeCore.Tests/**'
      - 'Source/AuthoritativeEntityGraph.Tests/**'
      - 'Source/AuthoritativeRimWorldBridge/**'
      - 'Source/AuthoritativeTransport/**'
      - 'Source/AuthoritativeTransport.Tests/**'
      - 'Source/AuthoritativeProbeMod/**'
      - 'Source/AuthoritativeProbeClient/**'
      - 'Experimental/AuthoritativeProbe/**'
      - 'scripts/package-authoritative-probe.sh'
      - '.github/workflows/authoritative-core.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build isolated authoritative core
        run: dotnet build Source/AuthoritativeCore/AuthoritativeCore.csproj -c Release --warnaserror
      - name: Build RimWorld-compatible netstandard2.0 target
        run: dotnet build Source/AuthoritativeCore/AuthoritativeCore.csproj -c Release --framework netstandard2.0 --warnaserror
      - name: Compile Verse integration bridge against RimWorld 1.6 references
        run: dotnet build Source/AuthoritativeRimWorldBridge/AuthoritativeRimWorldBridge.csproj -c Release
      - name: Build local TCP transport for net8 and netstandard2.0
        run: dotnet build Source/AuthoritativeTransport/AuthoritativeTransport.csproj -c Release --warnaserror
      - name: Build optional RimWorld 1.6 probe mod
        run: dotnet build Source/AuthoritativeProbeMod/AuthoritativeProbeMod.csproj -c Release
      - name: Build standalone local probe client
        run: dotnet build Source/AuthoritativeProbeClient/AuthoritativeProbeClient.csproj -c Release --warnaserror
      - name: Stage isolated test mod without proprietary game binaries
        run: bash scripts/package-authoritative-probe.sh "$RUNNER_TEMP/AuthoritativeProbeMod"
      - name: Execute real loopback TCP integration tests
        run: dotnet run --project Source/AuthoritativeTransport.Tests/AuthoritativeTransport.Tests.csproj -c Release
      - name: Execute focused authoritative tests
        run: dotnet run --project Source/AuthoritativeCore.Tests/AuthoritativeCore.Tests.csproj -c Release
      - name: Execute containment graph and atomic world-view tests
        run: dotnet run --project Source/AuthoritativeEntityGraph.Tests/AuthoritativeEntityGraph.Tests.csproj -c Release
